<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FACEBOOK GRID</title>
    <style>
        .grid-container {
            display: grid;
            /* 1fr creates 3 equal flexible columns instead of 10px fixed ones */
            grid-template-columns: 1fr 1fr 1fr; 
            column-gap: 10px;
            row-gap: 40px;
            
            border-width: 10px;
            
            height: 150px;

            
            


            ; /* Added some padding so the red background shows around the items */
        }
        
        /* Added styling to the inner items so you can clearly see the 3 boxes */
        .grid-item {
            background-color: rgb(255, 214, 8);
            padding: 10px;
            text-align: left;
            box-shadow: 1px 1px 5px rgba(0, 0, 0, 0.3);
            
            
            
            
        }
        .profile-img {
    width: 100%;      /* Forces the image to fit exactly inside its column */
    height: 100px;    /* You can set a fixed height if you want them all equal */
    object-fit: cover; /* Prevents the image from squishing or stretching */
    border-radius: 8px; /* Optional: gives the images nice curved corners */
    margin-bottom: 10px; /* Adds space between the image and the name below it */
}
    </style>
</head>
<body>
    
    <!-- The grid container now holds 3 separate items -->
    <div class="grid-container">
    <div class="grid-item">
        <img src="https://c.ndtvimg.com/2023-08/picvlmfg_cheems_625x300_20_August_23.jpg" alt="cHEEMS" class="profile-img">
        <br> <!-- Line break so the name goes under the image -->
        <b>DOGE</b>
    </div>
    
    <div class="grid-item">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ19zDIUdtbzycyizWxrZU7_YZQpR_Wmq65JvQmMXqlzQ&s=10" alt="Noah" class="profile-img">
        <br>
        <b>Noah</b>
    </div>
    
    <div class="grid-item">
        <img src="your-image-3.jpg" alt="Liam" class="profile-img">
        <br>
        <b>Liam</b>
    </div>
</div>
    
</body>
</html>
